<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=720,height=1280">
<title>iOS Ads Video</title>
<style>
:root{--blue:#007AFF;--blueD:#0A84FF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--gray:#8E8E93;--bg:#F2F2F7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#000}
body{font-family:'Inter','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.02em}
#stage{position:relative;width:720px;height:1280px;overflow:hidden}
.a{position:absolute;transform-origin:50% 50%}
.rel{position:relative;display:inline-block}
.scene{position:absolute;left:0;top:0;width:720px;height:1280px;overflow:hidden}
.words{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;align-items:center;column-gap:.27em;row-gap:.08em;line-height:1.12;text-align:center}
.app{border-radius:22.5%;box-shadow:0 10px 30px rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;overflow:hidden}
.app svg{width:100%;height:100%}
.card{background:#fff;border-radius:48px;box-shadow:0 20px 60px rgba(0,0,0,.10)}
.glass{background:rgba(44,44,46,.78);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.5)}
.dk{background:#1C1C1E;border-radius:48px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 20px 60px rgba(0,0,0,.6)}
.pill{border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:600}
.bub{position:absolute;border-radius:40px;padding:26px 36px;font-size:36px;font-weight:500;line-height:1.2;display:flex;align-items:center}
.bub.in{background:#262628;color:#fff}
.bub.out{background:#007AFF;color:#fff}
.bub.tail::before,.bub.tail::after{content:"";position:absolute;bottom:0;height:30px}
.bub.in.tail::before{left:-10px;width:24px;background:#262628;border-bottom-right-radius:26px}
.bub.in.tail::after{left:-14px;width:14px;background:#000;border-bottom-right-radius:20px}
.bub.out.tail::before{right:-10px;width:24px;background:#007AFF;border-bottom-left-radius:26px}
.bub.out.tail::after{right:-14px;width:14px;background:var(--bgc,#F2F2F7);border-bottom-left-radius:20px}
.tn{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
svg{display:block}
</style></head><body>
<div id="stage"></div>
<script>
/* ============ ENGINE ============ */
const stage=document.getElementById('stage');
const SFX=[];const sfx=(t,n,a={})=>SFX.push(Object.assign({t,n},a));
const EASE={lin:x=>x,out:x=>1-Math.pow(1-x,3),inout:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  spring:x=>x>=1?1:1-Math.exp(-7*x)*Math.cos(9*x),soft:x=>x>=1?1:1-Math.exp(-9*x)*Math.cos(5*x),in:x=>x*x*x};
const reg=[],tracked=[],fns=[],scenes=[];
function el(parent,cls,css,html){const d=document.createElement('div');d.className=(cls&&cls.includes('rel')?'':'a ')+(cls||'');d.style.cssText=css||'';if(html!=null)d.innerHTML=html;parent.appendChild(d);d._t={};return d}
function at(d,cx,cy,w,h){d.style.left=(cx-w/2)+'px';d.style.top=(cy-(h||0)/2)+'px';d.style.width=w+'px';if(h)d.style.height=h+'px';return d}
function tw(d,o){for(const k in o)d._t[k]=o[k];if(!d._tr){d._tr=1;tracked.push(d)}return d}
function pop(d,t,dur=.55,from=.4){return tw(d,{s:[[t,from],[t+dur,1,'spring']],o:[[t,0],[t+.07,1,'lin']]})}
function fadeIn(d,t,dur=.3,dy=0){const o={o:[[t,0],[t+dur,1,'out']]};if(dy)o.y=[[t,dy],[t+dur+.15,0,'out']];return tw(d,Object.assign({},d._t,o))}
function fadeOut(d,t,dur=.25){const prev=d._t.o||[[0,1]];return tw(d,{o:prev.concat([[t,1],[t+dur,0,'out']])})}
function val(k,t){if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++){if(t<k[i][0]){const a=k[i-1],b=k[i];return a[1]+(b[1]-a[1])*EASE[b[2]||'out']((t-a[0])/(b[0]-a[0]))}}return k[k.length-1][1]}
const ramp=(t,a,b,v0,v1,e='out')=>t<=a?v0:t>=b?v1:v0+(v1-v0)*EASE[e]((t-a)/(b-a));
function scene(a,b,bg,css=''){const r=el(stage,'scene','background:'+bg+';'+css);const g=el(r,'', 'left:0;top:0;width:720px;height:1280px');
  tw(r,{o:[[a-.18,0],[a+.12,1,'out']]});
  tw(g,{s:[[a-.18,1.05],[a+.55,1,'out'],[b-.22,1],[b+.08,.94,'inout']],o:[[b-.22,1],[b+.06,0,'out']],b:[[b-.22,0],[b+.08,8,'out']]});
  const S={r,g,a,b};scenes.push(S);return S}
function words(p,str,cx,cy,w,size,color,times,o={}){
  const c=el(p,'words',`font-size:${size}px;color:${color};font-weight:${o.wt||700};${o.css||''}`);at(c,cx,cy,w,o.h||size*3.6);
  str.split(' ').forEach((wd,i)=>{const s=el(c,'rel','',wd);if(o.hl&&o.hl[i])s.style.cssText+=o.hl[i];const t=times[i];
    tw(s,{o:[[t,0],[t+.28,1,'out']],y:[[t,size*.4],[t+.5,0,'out']],b:[[t,10],[t+.35,0,'out']]})});return c}
function ticks(a,b,n,vol=.5){for(let i=0;i<n;i++){const u=i/(n-1);sfx(a+(b-a)*(1-Math.pow(1-u,1.6)),'tick',{v:vol*(.6+.4*u),p:1+u*.4})}}

};
let UID=0;function uniq(svg){const u='_'+(UID++);return svg.replace(/id="(\w+)"/g,'id="$1'+u+'"').replace(/url\(#(\w+)\)/g,'url(#$1'+u+')')}
function icon(p,kind,cx,cy,size){const d=el(p,'app','');at(d,cx,cy,size,size);d.style.borderRadius=(size*.225)+'px';d.innerHTML=uniq(SV[kind]);return d}
