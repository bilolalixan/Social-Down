.bub.in{background:#262628;color:#fff}
.bub.out{background:#007AFF;color:#fff}
.bub.tail::before,.bub.tail::after{content:"";position:absolute;bottom:0;height:16px}
.bub.in.tail::before{left:-5px;width:13px;background:#262628;border-bottom-right-radius:14px}
.bub.in.tail::after{left:-8px;width:8px;background:#000;border-bottom-right-radius:10px}

svg{display:block}
