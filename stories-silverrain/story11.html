<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.story{position:relative;width:1080px;height:1920px;overflow:hidden;color:#FFF;
  font-family:"SF Pro Display","Inter Display",sans-serif;-webkit-font-smoothing:antialiased;
  background:url(face-blur.jpg) center/cover}
.story::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.70) 100%)}
.z{position:absolute;z-index:2}
.top{top:250px;left:80px;right:80px;display:flex;justify-content:space-between;font-size:28px;font-weight:400;letter-spacing:-.005em}
.top .d{opacity:.7;font-weight:300}
.txt{left:80px;right:80px;bottom:300px}
h1{font-weight:300;font-size:104px;line-height:1;letter-spacing:-.04em}
h1 b{font-weight:400}
.body{margin-top:48px;font-size:38px;font-weight:300;line-height:1.38;letter-spacing:-.01em;color:rgba(255,255,255,.88)}
.body b{font-weight:400;color:#FFF}
.cta{margin-top:56px;display:inline-flex;align-items:center;gap:18px;padding:22px 34px;border:1.5px solid rgba(255,255,255,.7);border-radius:100px;font-size:30px;font-weight:400;letter-spacing:-.01em;background:rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.cta span{font-size:30px}
.ls{list-style:none;margin-top:56px;border-top:1px solid rgba(255,255,255,.3)}
.ls li{display:flex;gap:28px;align-items:baseline;padding:26px 0;border-bottom:1px solid rgba(255,255,255,.3);font-size:36px;font-weight:300;line-height:1.28;letter-spacing:-.01em;color:#FFF}
.ls li span{font-size:26px;font-weight:400;color:rgba(255,255,255,.6);min-width:40px}
</style></head><body>
<section class="story">
  <div class="z top"><div>Silver Rain</div><div class="d">Est. 2011</div></div>
  <div class="z txt">
    <h1><b>Кому<br>рекомендуется</b></h1>
    <ul class="ls"><li><span>01</span>Тем, кто живёт в&nbsp;постоянном стрессе и&nbsp;усталости</li><li><span>02</span>Тем, у&nbsp;кого проблемы со&nbsp;сном</li><li><span>03</span>Тем, у&nbsp;кого высокий рабочий ритм</li><li><span>04</span>Тем, кто хочет глубоко отдохнуть и&nbsp;восстановиться</li></ul>
  </div>
</section></body></html>
