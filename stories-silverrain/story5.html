<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.story{position:relative;width:1080px;height:1920px;overflow:hidden;color:#FFF;
  font-family:"SF Pro Display","Inter Display",sans-serif;-webkit-font-smoothing:antialiased;
  background:url(pool-blur.jpg) center/cover}
.story::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.70) 100%)}
.z{position:absolute;z-index:2}
.top{top:250px;left:80px;right:80px;display:flex;justify-content:space-between;font-size:28px;font-weight:400;letter-spacing:-.005em}
.top .d{opacity:.7;font-weight:300}
.txt{left:80px;right:80px;bottom:300px}
h1{font-weight:300;font-size:150px;line-height:1;letter-spacing:-.04em}
h1 b{font-weight:400}
.body{margin-top:48px;font-size:38px;font-weight:300;line-height:1.38;letter-spacing:-.01em;color:rgba(255,255,255,.88)}
.body b{font-weight:400;color:#FFF}
.h2{font-weight:300;font-size:92px;line-height:1;letter-spacing:-.04em}
.h2 b{font-weight:400}
.grid{margin-top:72px;display:grid;grid-template-columns:1fr 1fr;column-gap:48px;row-gap:56px}
.st{border-top:1px solid rgba(255,255,255,.35);padding-top:28px}
.st .n{font-size:104px;font-weight:300;line-height:1;letter-spacing:-.045em}
.st .l{margin-top:16px;font-size:30px;font-weight:400;line-height:1.25;color:rgba(255,255,255,.8);letter-spacing:-.01em}
</style></head><body>
<section class="story">
  <div class="z top"><div>Silver Rain</div><div class="d">Est. 2011</div></div>
  <div class="z txt">
    <div class="h2">Silver Rain<br><b>в цифрах</b></div>
    <div class="grid">
      <div class="st"><div class="n">15</div><div class="l">лет на рынке</div></div>
      <div class="st"><div class="n">20 000+</div><div class="l">довольных гостей</div></div>
      <div class="st"><div class="n">20+</div><div class="l">видов процедур</div></div>
      <div class="st"><div class="n">30</div><div class="l">мастеров</div></div>
    </div>
  </div>
</section></body></html>
