<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.story{position:relative;width:1080px;height:1920px;overflow:hidden;color:#FFF;
  font-family:"SF Pro Display","Inter Display",sans-serif;-webkit-font-smoothing:antialiased;
  background:url(peel4-blur.jpg) center/cover}
.story::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.70) 100%)}
.z{position:absolute;z-index:2}
.top{top:250px;left:80px;right:80px;display:flex;justify-content:space-between;font-size:28px;font-weight:400;letter-spacing:-.005em}
.top .d{opacity:.7;font-weight:300}
.txt{left:80px;right:80px;bottom:300px}
h1{font-weight:300;font-size:96px;line-height:1;letter-spacing:-.04em}
h1 b{font-weight:400}
.body{margin-top:48px;font-size:38px;font-weight:300;line-height:1.38;letter-spacing:-.01em;color:rgba(255,255,255,.88)}
.body b{font-weight:400;color:#FFF}
.cta{margin-top:56px;display:inline-flex;align-items:center;gap:18px;padding:22px 34px;border:1.5px solid rgba(255,255,255,.7);border-radius:100px;font-size:30px;font-weight:400;letter-spacing:-.01em;background:rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.cta span{font-size:30px}
.story::after{background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.1) 22%,rgba(0,0,0,.15) 36%,rgba(0,0,0,.65) 55%,rgba(0,0,0,.85) 100%)}
.facts{margin-top:40px;display:flex;border-top:1px solid rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.3)}
.facts div{flex:1;padding:24px 0}
.facts div+div{border-left:1px solid rgba(255,255,255,.3);padding-left:28px}
.facts b{display:block;font-size:48px;font-weight:400;letter-spacing:-.03em}
.facts span{font-size:24px;font-weight:300;color:rgba(255,255,255,.7)}
.body{margin-top:36px}
.pre{font-size:28px;font-weight:300;color:rgba(255,255,255,.75);margin-bottom:20px}
.pd{margin-top:28px;font-size:34px;font-weight:300;line-height:1.38;color:rgba(255,255,255,.9);letter-spacing:-.01em}
.yn{margin-top:32px;border-top:1px solid rgba(255,255,255,.3)}
.yn div{display:flex;gap:22px;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.3);font-size:30px;font-weight:300;line-height:1.32;color:rgba(255,255,255,.9)}
.yn b{flex:0 0 190px;font-weight:400;color:#fff}
.pr{margin-top:28px;font-size:34px;font-weight:400}
.pr span{color:rgba(255,255,255,.65);font-weight:300}
</style></head><body>
<section class="story">
  <div class="z top"><div>Silver Rain Bali</div><div class="d">Est. 2011</div></div>
  <div class="z txt">
    <div class="pre">Пилинг 03 / 04 · Классический хаммам</div>
    <h1><b>Пенный пилинг</b></h1>
    <div class="pd">Очищение кесе (специальной рукавицей) и&nbsp;массаж мыльной пеной. Традиционная процедура турецкого хаммама.</div>
    <div class="yn"><div><b>Подойдёт</b><span>Если хотите классический хаммам и&nbsp;мягкое очищение</span></div></div>
    <div class="pr"><span>40 мин ·</span> 650 000 сум</div>
  </div>
</section></body></html>
