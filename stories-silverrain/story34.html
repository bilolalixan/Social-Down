<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.story{position:relative;width:1080px;height:1920px;overflow:hidden;color:#FFF;
  font-family:"SF Pro Display","Inter Display",sans-serif;-webkit-font-smoothing:antialiased;
  background:url(baliqa3-blur.jpg) center/cover}
.story::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.70) 100%)}
.z{position:absolute;z-index:2}
.top{top:250px;left:80px;right:80px;display:flex;justify-content:space-between;font-size:28px;font-weight:400;letter-spacing:-.005em}
.top .d{opacity:.7;font-weight:300}
.txt{left:80px;right:80px;bottom:300px}
h1{font-weight:300;font-size:120px;line-height:1;letter-spacing:-.04em}
h1 b{font-weight:400}
.body{margin-top:48px;font-size:38px;font-weight:300;line-height:1.38;letter-spacing:-.01em;color:rgba(255,255,255,.88)}
.body b{font-weight:400;color:#FFF}
.cta{margin-top:56px;display:inline-flex;align-items:center;gap:18px;padding:22px 34px;border:1.5px solid rgba(255,255,255,.7);border-radius:100px;font-size:30px;font-weight:400;letter-spacing:-.01em;background:rgba(255,255,255,.08);backdrop-filter:blur(10px)}
.cta span{font-size:30px}
.tag{display:inline-block;font-size:26px;font-weight:400;letter-spacing:.02em;padding:10px 22px;border:1.5px solid rgba(255,255,255,.6);border-radius:100px;margin-bottom:36px}
.qq{font-size:66px;font-weight:400;letter-spacing:-.035em;line-height:1.1}
.ans{margin-top:44px;padding-top:36px;border-top:1px solid rgba(255,255,255,.3);font-size:38px;font-weight:300;line-height:1.38;letter-spacing:-.01em;color:rgba(255,255,255,.88)}
.ans b{font-weight:400;color:#FFF}
.story::after{background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.1) 22%,rgba(0,0,0,.15) 36%,rgba(0,0,0,.65) 55%,rgba(0,0,0,.85) 100%)}
.opt{border-top:1px solid rgba(255,255,255,.3);padding:26px 0 24px}
.opt:last-of-type{border-bottom:1px solid rgba(255,255,255,.3)}
.opt h3{font-size:40px;font-weight:400;letter-spacing:-.02em}
.opt p{margin-top:6px;font-size:30px;font-weight:300;color:rgba(255,255,255,.8);letter-spacing:-.01em}
.opt .pr{margin-top:14px;display:flex;gap:40px;font-size:32px;font-weight:400}
.opt .pr span{color:rgba(255,255,255,.6);font-weight:300;margin-right:10px}
.opts{margin-top:40px}
.note{margin-top:30px;font-size:30px;font-weight:300;color:rgba(255,255,255,.8);line-height:1.35}
.qq{font-size:60px}
.tags{margin-top:36px;display:flex;flex-wrap:wrap;gap:12px}
.tags span{font-size:28px;font-weight:300;padding:10px 20px;border:1px solid rgba(255,255,255,.35);border-radius:100px;letter-spacing:-.01em}
.price{margin-top:36px;padding:26px 0;border-top:1px solid rgba(255,255,255,.3);border-bottom:1px solid rgba(255,255,255,.3);display:flex;justify-content:space-between;align-items:baseline}
.price b{font-size:54px;font-weight:400;letter-spacing:-.035em}
.price span{font-size:30px;font-weight:300;color:rgba(255,255,255,.8)}
.sub{margin-top:24px;font-size:34px;font-weight:300;color:rgba(255,255,255,.88);letter-spacing:-.01em}
.sub b{font-weight:400;color:#fff}
</style></head><body>
<section class="story">
  <div class="z top"><div>Silver Rain Bali</div><div class="d">Est. 2011</div></div>
  <div class="z txt">
    <div class="tag">Q&amp;A</div>
    <div class="qq">Что есть для двоих?</div>
    <div class="sub"><b>Royal Couple Retreat</b> — 3&nbsp;часа для&nbsp;двоих:</div>
    <div class="tags"><span>Акватермальная зона</span><span>Кофейный пилинг</span><span>Аромаванна</span><span>Ароматерапия</span><span>Маска для лица</span><span>Лаунж&#8209;зона и&nbsp;чайный сет</span></div>
    <div class="price"><b>4 200 000 сум</b><span>за двоих</span></div>
  </div>
</section></body></html>
